# Runs on every pull request and on main. These jobs are the required status checks.
# Actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LYCHEE_VERSION: 0.24.2
      # From lychee-x86_64-unknown-linux-gnu.tar.gz.sha256 on the official release.
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install exiftool (image metadata check)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libimage-exiftool-perl

      # The link check runs inside pnpm check (check:links in package.json), so CI and
      # local runs use the same flags. Internal links only (--offline), so external
      # sites can't make it flaky. --fallback-extensions html: clean URLs (/privacy)
      # resolve to privacy.html. --index-files index.html,.: fragments like /#find-us
      # are checked against index.html; plain folder links in docs stay valid.
      - name: Install lychee (link check, checksum verified)
        run: |
          file="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$file" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${file}"
          echo "${LYCHEE_SHA256}  ${file}" | sha256sum --check --strict
          tar -xzf "$file" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          sudo install -m 0755 lychee /usr/local/bin/lychee
          rm -f lychee "$file"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm check (types, format, build, HTML, inline code, image metadata, links)
        run: pnpm check

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the official release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum --check --strict
          tar -xzf "$file" gitleaks

      - name: Scan full history
        run: ./gitleaks git --no-banner --redact .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
