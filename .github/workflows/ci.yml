# Runs on every pull request and on main. These jobs are the required status checks.
# Actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install exiftool (image metadata check)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libimage-exiftool-perl

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm check (types, format, build, HTML, inline code, image metadata)
        run: pnpm check

      - name: Link check (internal links only, so external sites can't make it flaky)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --fallback-extensions html: links use clean URLs (/privacy) that Workers
          # serves from privacy.html, so the checker also tries the .html file.
          # --index-files index.html,.: "/" means index.html, so fragments like
          # /#find-us are checked; plain folder links in docs stay valid.
          args: >-
            --offline --no-progress --include-fragments --fallback-extensions html
            --index-files index.html,.
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html' '*.md' 'docs/**/*.md'
          fail: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the official release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum --check --strict
          tar -xzf "$file" gitleaks

      - name: Scan full history
        run: ./gitleaks git --no-banner --redact .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
